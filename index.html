<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfessionalDev CareerOS</title>
    <script>
      (function () {
        try {
          // Resolve Light / Dark / System before first paint so the page never flashes the wrong theme.
          var p = localStorage.getItem("pd-theme-pref");
          var t = p === "light" || p === "dark" ? p : null;
          if (!t && p !== "system") t = localStorage.getItem("pd-theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          if (t === "light") {
            document.documentElement.classList.add("light");
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
